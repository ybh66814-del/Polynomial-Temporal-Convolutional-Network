[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "signal-comparison-architectures"
version = "0.2.0"
description = "Seven TensorFlow signal comparison architectures, without data or training artifacts"
readme = "README.md"
requires-python = ">=3.8,<3.12"
dependencies = ["tensorflow==2.13.0", "keras==2.13.1", "numpy==1.24.3"]

[tool.setuptools.packages.find]
where = ["."]
include = ["comparison_models*"]
